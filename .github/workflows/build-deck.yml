name: Build deck

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python scripts/build_deck.py src dist/my-anki-cards.apkg

      - uses: actions/upload-artifact@v7
        with:
          path: dist/my-anki-cards.apkg
          archive: false
          if-no-files-found: error
