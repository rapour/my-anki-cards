name: Build deck

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python scripts/build_deck.py src dist/my-anki-cards.apkg

      - uses: actions/upload-artifact@v7
        with:
          path: dist/my-anki-cards.apkg
          archive: false
          if-no-files-found: error

      - if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/my-anki-cards.apkg \
            --target "$GITHUB_SHA" \
            --title "Latest deck" \
            --notes "Built from $GITHUB_SHA"
